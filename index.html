<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1a73">
<title>Kobold Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/*CSS*/
</style>
<section class="view title" id="v-title">
  <div class="tlogo">Kobold<span>Quest</span></div>
  <p class="ttag">Every kobold has one ember. The dragon egg needs them all.</p>
  <canvas id="title-cv" width="360" height="170" role="img" aria-label="Pip and two friends send their embers to a dragon egg below Hearthspire's tower fire"></canvas>
  <form class="tlogin" id="login" hidden autocomplete="on">
    <input id="login-name" name="username" autocomplete="username" placeholder="Kobold name" maxlength="16" autocapitalize="off" spellcheck="false" aria-label="Name">
    <input id="login-pass" name="password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password">
    <input id="login-code" hidden autocomplete="off" placeholder="Reset code" maxlength="12" autocapitalize="characters" spellcheck="false" aria-label="Reset code">
    <div class="trow"><button class="pill go" id="login-go" type="submit">Log in</button><button class="pill" id="login-new" type="button">New account</button></div>
    <button class="linkbtn" id="login-hascode" type="button">I have a reset code</button>
    <p class="tlmsg" id="login-msg" role="status"></p>
  </form>
  <button class="bigplay" id="go-rpg" type="button">Play</button>
  <p class="tuser" id="tuser" hidden>Playing as <b id="tuser-name"></b> · <button class="linkbtn" id="logout" type="button">Log out</button></p>
  <div class="trow"><button class="pill" id="sound" type="button" aria-pressed="false">Sound off</button></div>
  <p class="foot">A cozy tactics RPG, alone or with friends &middot; Best played sideways</p>
</section>
<section class="view rpview" id="v-rpg" hidden>
  <div class="rptop" id="rp-top"><div id="rp-topt"></div></div>
  <div class="rpboard"><canvas id="rpcv" role="img" aria-label="The world of Kobold Quest"></canvas></div>
  <div class="rppanel" id="rp-panel"></div>
  <div class="rphero" id="rp-hero" hidden></div>
</section>
<script>
/*JS*/
</script>
