<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1a73">
<title>Kobold Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Base: colours and fonts, buttons and pills shared by every screen. */
:root{
  color-scheme:dark;
}
body{color:var(--fg);font-family:var(--font-ui);font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.view{display:flex;flex-direction:column;gap:12px}
@keyframes pulse{50%{opacity:.25}}
[hidden]{display:none!important}
:root{
  --bg:#2a1a73;--panel:#4a35b0;--panel-hi:#6150d6;--line:#140a35;--fg:#ffffff;--muted:#d9cfff;--amber:#ffd23f;
  --font-display:'Lilita One','Luckiest Guy',ui-rounded,system-ui,sans-serif;
  --font-ui:'Fredoka','Baloo 2',ui-rounded,'Trebuchet MS',system-ui,sans-serif;
  --gel-blue:linear-gradient(#a99bff 0%,#7459ee 48%,#5a3fd2 52%,#7459ee 100%);
  --gel-gold:linear-gradient(#fff6a8 0%,#ffcf2e 48%,#ffa800 52%,#ffcf2e 100%);
  --gel-lime:linear-gradient(#d4ff9a 0%,#79e033 48%,#4cbc16 52%,#79e033 100%);
  --gel-red:linear-gradient(#ffb0a8 0%,#ff6a5a 48%,#e83c2c 52%,#ff6a5a 100%);
}
body{line-height:1.35;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(ellipse 120% 70% at 50% 0%,#8a6bff 0%,#5136d0 40%,#24146e 100%) fixed;
  font-weight:500;text-shadow:0 1px 0 rgba(20,10,53,.55);
}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:repeating-conic-gradient(from 0deg at 50% 12%,rgba(255,255,255,.075) 0 5deg,transparent 5deg 10deg)}
.pill{position:relative;border:3px solid var(--line);background:var(--gel-blue);color:#fff;border-radius:999px;padding:3px 18px;font-weight:700;font-size:15px;min-height:42px;
  text-shadow:0 2px 0 rgba(20,10,53,.6);box-shadow:0 4px 0 var(--line),inset 0 2px 0 rgba(255,255,255,.6);transition:transform .07s,box-shadow .07s,filter .1s}
.pill:hover{background:var(--gel-blue);filter:brightness(1.12)}
.pill:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line),inset 0 2px 0 rgba(255,255,255,.4)}
.pill[aria-pressed="true"]{background:var(--gel-lime);border-color:var(--line);color:#173300;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.pill:disabled{filter:grayscale(.85) brightness(.8);cursor:default;transform:none}
html,body{overflow-x:clip;max-width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Title screen. */
.foot{margin:10px 0 0;text-align:center;font-size:12px;font-weight:600;color:var(--muted);line-height:1.6}
.foot b{color:var(--amber)}

/* title: logo, three kobolds, one big Play button. Upright phones stack it; anything wide puts the button beside the art */
#v-title{position:fixed;inset:0;z-index:40;display:grid;place-content:center;justify-items:center;gap:10px;padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));text-align:center;overflow:hidden;
  background:radial-gradient(ellipse at 50% 30%,#8a6bff 0%,#3a22a0 55%,#1a0d4a 100%)}
#v-title::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 40%,rgba(255,255,255,.07) 0 5deg,transparent 5deg 10deg);pointer-events:none}
#v-title>*{position:relative}
.tlogo{font:400 clamp(46px,13vmin,92px)/.92 var(--font-display);color:#fff;-webkit-text-stroke:5px var(--line);paint-order:stroke fill;text-shadow:0 7px 0 var(--line);transform:rotate(-3deg)}
.tlogo span{color:var(--amber);display:block}
#title-cv{display:block;width:min(300px,78vw);height:auto;aspect-ratio:300/130}
.bigplay{position:relative;min-width:220px;min-height:64px;padding:6px 40px;border:4px solid var(--line);border-radius:999px;background:var(--gel-gold);color:#4a2400;
  font:400 32px/1 var(--font-display);letter-spacing:.02em;text-shadow:0 2px 0 rgba(255,255,255,.7);box-shadow:0 6px 0 var(--line),inset 0 3px 0 rgba(255,255,255,.65);transition:transform .07s,box-shadow .07s,filter .1s}
.bigplay:hover{filter:brightness(1.08)}
.bigplay:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line),inset 0 3px 0 rgba(255,255,255,.5)}
.trow{display:flex;gap:10px;justify-content:center}
#v-title .foot{margin:2px 0 0;font-size:11.5px}
@media (orientation:landscape) and (max-height:560px){
  #v-title{grid-template-columns:auto auto;grid-template-areas:"logo play" "art play" "art user" "art row" "foot foot";column-gap:28px;align-items:center}
  .tlogo{grid-area:logo;font-size:clamp(40px,14vh,72px)}#title-cv{grid-area:art;width:min(300px,42vw)}.bigplay{grid-area:play;align-self:end}#v-title>.trow{grid-area:row;align-self:start}#v-title .foot{grid-area:foot}}
/* website login on the title screen */
.tlogin{display:grid;gap:8px;width:min(300px,86vw)}
.tlogin input{font:600 17px var(--font-ui);color:#fff;background:#1a0d4a;border:3px solid var(--line);border-radius:14px;padding:9px 14px;box-shadow:inset 0 2px 0 rgba(0,0,0,.35);text-shadow:none}
.tlogin input::placeholder{color:#a99bdc}
.tlogin input:focus{outline:3px solid var(--amber);outline-offset:1px}
.tlogin .trow .pill{flex:1}
.tlmsg{margin:0;min-height:1.3em;font-size:13.5px;font-weight:600;color:var(--muted)}
.tlmsg.bad{color:#ffb0a8}
.tuser{margin:0;font-size:13.5px;font-weight:600;color:var(--muted)}
.tuser b{color:#fff}
.linkbtn{background:none;border:0;padding:2px 4px;color:var(--amber);font-weight:700;text-decoration:underline;text-underline-offset:3px}
@media (orientation:landscape) and (max-height:560px){.tlogin{grid-area:play;align-self:center}.tuser{grid-area:user}}
/* The game view: map canvas, top bar, joystick and buttons, and the sideways (rotated) layout. */
.rpview{box-sizing:border-box;display:flex;flex-direction:column;gap:6px;padding:6px max(6px,env(safe-area-inset-right)) 6px max(6px,env(safe-area-inset-left));background:var(--bg);height:100vh;height:100dvh;overflow:hidden;max-width:640px;margin:0 auto}
.rpview[hidden]{display:none}
.rptop{flex:none;display:flex;align-items:center;gap:8px;border:3px solid var(--line);border-radius:14px;background:linear-gradient(#6a55e0,#4a35b0);color:#fff;box-shadow:0 3px 0 var(--line)}
#rp-topt{flex:1;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;min-width:0;font-size:13px;font-weight:700}
#rp-topt b{font:400 18px/1 var(--font-display);-webkit-text-stroke:1.5px var(--line);paint-order:stroke fill}
#rp-topt .rpq{color:#ffe27a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rpboard{flex:1;min-height:0;display:flex}
.rpboard canvas{border:3px solid var(--line);border-radius:14px;box-shadow:0 3px 0 var(--line);display:block}
.rppanel{flex:none;height:min(40vh,300px);overflow-y:auto;border:3px solid var(--line);border-radius:16px;padding:8px;background:linear-gradient(#4a35b0,#2a1c6e);color:#fff;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;gap:6px}
.rpparty{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.rpm{background:rgba(20,10,53,.5);border-radius:10px;padding:4px 6px;font-size:12px;display:flex;flex-direction:column;gap:2px}
.rpm b{font-size:13px}
.rpm small{font-size:11px;opacity:.9}
.rpm.down{opacity:.5}
.rpbar{display:block;height:7px;border-radius:9px;background:#12082e;border:1.5px solid var(--line);overflow:hidden}
.rpbar b{display:block;height:100%}
.rpside{flex-direction:column;flex:1;min-width:0}
.rptip{margin:0;font-size:12px;opacity:.85}
.rpview{position:fixed;inset:0;width:100%;left:0}
.rpboard{align-items:center;justify-content:center;min-width:0;overflow:hidden}
.rpboard canvas{image-rendering:auto;max-width:100%;max-height:100%}
.rppanel,.rptop{min-width:0}
#v-rpg .rppanel{height:min(310px,46vh);max-height:none}
.rpjoy{flex:none;width:124px;height:124px;border-radius:50%;position:relative;touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab;background:radial-gradient(circle,#2a1c6e 0 38%,#3b2a92 39% 100%);border:3px solid var(--line);box-shadow:inset 0 0 0 3px rgba(255,255,255,.12),0 3px 0 var(--line)}
.rpjoy::before{content:"";position:absolute;inset:10px;border-radius:50%;border:2px dashed rgba(255,226,122,.35)}
.rpjoy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:linear-gradient(#ffe27a,#ffb347);border:3px solid var(--line);box-shadow:0 3px 0 var(--line);transform:translate(var(--jx,0px),var(--jy,0px));pointer-events:none}
.rpjoy.on i{background:linear-gradient(#fff3b0,#ffc857)}
.rpview{z-index:50;right:0;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;padding-bottom:max(6px,env(safe-area-inset-bottom))}
#rpcv{touch-action:none;-webkit-touch-callout:none}
.rptop{padding:4px 10px}
.rppad{display:flex;gap:12px;align-items:flex-end}
.rpside{display:flex;gap:7px}
.rpside .pill.big{padding:14px 10px;font-size:17px}
.rprow2{display:flex;gap:6px}
.rprow2 .pill{flex:1;padding:10px 6px}
#v-rpg.lefty .rppad{flex-direction:row-reverse}
#v-rpg.rot{inset:auto;top:0;left:0;right:auto;bottom:auto;width:100vh;width:100dvh;height:100vw;max-width:none;transform-origin:0 0;transform:translateX(100vw) rotate(90deg);padding:6px max(6px,env(safe-area-inset-top)) 6px max(6px,env(safe-area-inset-bottom))}
#v-rpg{display:block;padding:0;max-width:none}
#v-rpg .rptop{position:absolute;z-index:6;top:max(6px,env(safe-area-inset-top));left:8px;right:8px;padding:3px 10px;background:rgba(58,40,170,.82);backdrop-filter:blur(2px)}
#v-rpg #rp-topt b{font-size:15px}
#v-rpg .rpboard{position:absolute;inset:0;display:block}
#v-rpg .rpboard canvas{border:0;border-radius:0;box-shadow:none;max-width:none;max-height:none}
#v-rpg .rppanel,#v-rpg[data-mode] .rppanel{position:absolute;z-index:5;top:48px;right:8px;bottom:8px;left:auto;width:min(460px,46%);height:auto;max-height:none;background:linear-gradient(rgba(74,53,176,.95),rgba(42,28,110,.95))}
#v-rpg[data-mode="map"] #rp-panel.rppanel{inset:0;width:auto;height:auto;top:0;left:0;right:0;bottom:0;background:none;border:0;box-shadow:none;padding:0;overflow:visible;pointer-events:none}
#v-rpg[data-mode="map"] .rppanel>*,#v-rpg[data-mode="map"] .rpjoy,#v-rpg[data-mode="map"] .rpside{pointer-events:auto}
#v-rpg[data-mode="map"] .rppad{pointer-events:none}
#v-rpg[data-mode="map"] .rpparty{position:absolute;top:48px;right:8px;width:min(400px,52%)}
#v-rpg[data-mode="map"] .rpm{background:rgba(20,10,53,.72);backdrop-filter:blur(2px)}
#v-rpg[data-mode="map"] .rpjoy{position:absolute;left:18px;bottom:18px;opacity:.9}
#v-rpg[data-mode="map"] .rpside{position:absolute;right:14px;bottom:14px;width:min(250px,40%)}
#v-rpg[data-mode="map"] .rptip{display:none}
#v-rpg.lefty[data-mode="map"] .rpjoy{left:auto;right:18px}
#v-rpg.lefty[data-mode="map"] .rpside{right:auto;left:14px}
/* v6 screens (ui-design.md §6–10): the pack as buttons, the "!" badge, a low-HP pulse; big text; reduced motion */
.rpparty button.rpm{font:inherit;color:inherit;text-align:left;cursor:pointer}
.rpparty .badge{display:inline-block;font-style:normal;background:#ffd54a;color:#3a1d00;border-radius:9px;padding:0 6px;font-weight:900}
.rpparty .rpm.low{animation:lowpulse 1s ease-in-out infinite alternate}
@keyframes lowpulse{from{box-shadow:0 0 0 0 rgba(255,107,107,0)}to{box-shadow:0 0 0 3px rgba(255,107,107,.75)}}
html.cb .rpparty .rpm.low{animation-name:lowpulsecb}
@keyframes lowpulsecb{from{box-shadow:0 0 0 0 rgba(255,159,28,0)}to{box-shadow:0 0 0 3px rgba(255,159,28,.85)}}
html.bigtext #rp-panel,html.bigtext #rp-top{font-size:125%}
html.calm *{animation:none!important;transition:none!important}
.corr{margin:6px 0;font-size:13px}.corr .rpbar{margin:3px 0}
/* tap targets at least 44 px (ui-design.md §10, checked by browser/tsmoke6) */
#rp-panel .rpb,#rp-panel .pill{min-height:44px}
/* Side sheets: dialogue, menu, shop, level-up, class, smith, promotion. */
.pill.go{background:var(--gel-gold);border-color:var(--line);color:#4a2400;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.pill.go:hover{background:var(--gel-gold)}
.tdhint{margin:2px 0;font-weight:600;font-size:13px}
.rpmsg{font-weight:800;font-size:14px;min-height:20px}
.rpcmd{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:5px}
.rpb{font:inherit;text-align:left;padding:6px 8px;border-radius:11px;border:2.5px solid var(--line);background:linear-gradient(#b9a8ff,#7a62e8);color:#fff;font-weight:800;font-size:13.5px;cursor:pointer;box-shadow:0 2px 0 var(--line);display:flex;flex-direction:column;touch-action:manipulation}
.rpb small{font-size:10.5px;font-weight:600;opacity:.92;line-height:1.15}
.rpb.go{background:linear-gradient(#ffe27a,#ffb347);color:#3a1d00}
.rpb.sk{background:linear-gradient(#8fd8ff,#4a9fe0);color:#06223a}
.rpb.it{background:linear-gradient(#c8ff9e,#7ad65a);color:#1e3a10}
.rpb.x{background:#3a2a8a}
.rpb:disabled{filter:grayscale(.7);opacity:.5;cursor:default}
.rpdlg .who{font:400 17px/1.1 var(--font-display);color:#ffe27a;-webkit-text-stroke:1px var(--line);paint-order:stroke fill;margin-bottom:2px}
.rpdlg p{margin:0 0 6px;font-weight:600;font-size:14.5px;line-height:1.35}
.rpch{display:flex;gap:6px;flex-wrap:wrap}
.rpmenu p{margin:0 0 6px;font-size:12.5px}
.rpcmd.lvl{grid-template-columns:1fr 1fr}
.rpcmd.lvl .rpb{padding:10px;font-size:15px}
.rpb.on{outline:3px solid #fff;outline-offset:-1px}
.rpb.mg{background:linear-gradient(#a8d8ff,#5a8fe0);color:#06223a}
.rpb.set{background:linear-gradient(#c8ff9e,#5fb04a);color:#1e3a10}
.mats{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.mat{font-size:11px;font-weight:800;padding:1px 7px;border-radius:9px;background:rgba(20,10,53,.55);border:1.5px solid var(--mc);color:var(--mc)}
button,.rpb,.pill{touch-action:manipulation}

/* the world map (inn wall) fills the screen below the top bar */
#v-rpg[data-mode="worldmap"] #rp-panel.rppanel{left:8px;width:auto}
.wmap{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;container-type:size}
.wmapbox{position:relative;width:min(100cqw,171.4cqh);aspect-ratio:600/350;border:3px solid var(--line);border-radius:10px;background:#3a8fd9;box-shadow:0 2px 0 var(--line)}
.wmapbox img{display:block;width:100%;height:100%;border-radius:7px;image-rendering:pixelated}
.wmapbox i{position:absolute;transform:translate(-50%,-50%);font-style:normal;pointer-events:none;white-space:nowrap}
.wmt{font:700 10.5px/1 var(--font-body,system-ui);color:#fff;-webkit-text-stroke:2.5px var(--line);paint-order:stroke fill;display:flex;flex-direction:column;align-items:center;gap:1px}
.wmt b{width:7px;height:7px;border-radius:2px;background:#ffd54a;border:1.5px solid var(--line)}
.wmr{min-width:15px;height:15px;padding:0 2px;border-radius:8px;background:rgba(20,10,53,.75);color:#ffe27a;font:800 9.5px/15px system-ui,sans-serif;text-align:center}
.wmyou{width:12px;height:12px;border-radius:50%;background:#ff3b5c;border:2px solid #fff;box-shadow:0 0 0 2px var(--line);animation:wmpulse 1s ease-in-out infinite alternate}
@keyframes wmpulse{to{transform:translate(-50%,-50%) scale(1.35)}}
/* Tactical battles: turn queue, unit panel, action buttons. */
.rpcmd.lvl .tic{font-size:20px}
.tq{display:flex;gap:4px;overflow:hidden;margin-bottom:4px}
.tq span{flex:none;font-size:11px;font-weight:800;padding:2px 7px;border-radius:9px;border:2px solid var(--line);background:#4a3aa8;color:#fff;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tq span.foe{background:#8a2f4a}
.tq span.now{background:#ffd54a;color:#3a1d00;transform:scale(1.06)}
.tparty{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tpm{background:rgba(20,10,53,.5);border-radius:9px;padding:3px 6px;font-size:11px;display:flex;flex-direction:column;gap:1px;border:2px solid transparent}
.tpm b{font-size:12px}
.tpm small{font-size:10.5px;opacity:.92}
.tpm.on{border-color:#ffd54a}
.tpm.down{opacity:.5}
.tpm.gone{opacity:.35}
.tmsg{font-size:12.5px;font-weight:600;line-height:1.3;margin:3px 0;min-height:18px}
.tmsg b{font-weight:800}
.tmsg .hp{color:#ffd54a}
.tmsg small{opacity:.8}
.tcmd{grid-template-columns:repeat(3,1fr)}
.tcmd .rpb{padding:5px 6px;font-size:12.5px;min-width:0}
.tcmd .rpb small{font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.tbar .rptip{flex:1 1 140px;margin:0}
.tpm.fr{border-color:#9ad0ff55}
.tpm b i{font-style:normal;font-weight:600;font-size:10px;color:#9ad0ff}
.tbar.two{display:grid;grid-template-columns:1fr 2fr}
.tbar.two .rpb{padding:10px;font-size:15px;align-items:center;text-align:center}
#v-rpg[data-mode="battle"] .rpboard{inset:48px calc(min(460px,46%) + 14px) 8px 8px;display:flex;align-items:center;justify-content:center}
#v-rpg[data-mode="battle"] .rpboard canvas{border:3px solid var(--line);border-radius:12px}
/* v6 (ui-design.md §8): the timeline's owner colours in a shared fight, the active turn larger with its seconds; dark skills */
.tq span.now{font-size:13px;padding:3px 9px}
.tq span.oh{box-shadow:inset 0 -3px 0 #ffb347}
.tq span.og{box-shadow:inset 0 -3px 0 #5fd0ff}
.tq span i{font-style:normal;font-size:10px;opacity:.85}
.rpb.sk.dark{background:linear-gradient(#5a2d82,#3d1a5e);border-color:#b77dff;color:#fff}
.rpb.sk.dark small{color:#e0c3ff}
.rpdlg.result.win .who{color:#ffd54a}.rpdlg.result p{margin:4px 0}
/* Heroes & gear screen: paper doll, backpack, stats. */
.rphero{position:absolute;left:6px;right:6px;top:6px;bottom:6px;z-index:5;display:flex;flex-direction:column;gap:6px;padding:8px;border:4px solid #3a2410;border-radius:14px;
  background:linear-gradient(rgba(60,35,15,.25),rgba(30,15,5,.35)),repeating-linear-gradient(90deg,#6b4423 0 22px,#5e3b1e 22px 44px);box-shadow:inset 0 0 0 2px #c9a24a,0 4px 0 var(--line);color:#f6e7c1;overflow:hidden;overflow-y:auto}
.rphero[hidden]{display:none}
.hh-tabs{display:flex;gap:5px;align-items:stretch}
.hh-tab{flex:1;font:inherit;font-weight:800;font-size:13px;padding:4px 6px;border-radius:8px;border:2px solid #2a1808;background:linear-gradient(#8a6a3a,#5a3e1e);color:#f6e7c1;cursor:pointer;display:flex;flex-direction:column;line-height:1.1}
.hh-tab small{font-size:10.5px;font-weight:600;opacity:.85}
.hh-tab.on{background:linear-gradient(#f2d27a,#c99a3a);color:#2a1808;box-shadow:inset 0 0 0 2px #fff3c4}
.hh-x{font:inherit;font-weight:800;border-radius:8px;border:2px solid #2a1808;cursor:pointer}
.hh-main{display:flex;gap:8px;flex:1;min-height:0}
.hh-doll{position:relative;flex:none;align-self:flex-start;height:auto;width:min(56%,300px);aspect-ratio:1;border-radius:10px;background:radial-gradient(circle at 50% 45%,#e8d6a8 0,#c9b07a 55%,#9a7a48 100%);border:3px solid #2a1808;box-shadow:inset 0 0 18px rgba(60,30,0,.55)}
.hh-por{position:absolute;left:22%;top:16%;width:56%;height:56%}
.hh-slot{position:absolute;width:18%;aspect-ratio:1;border-radius:6px;border:2px solid #2a1808;background:linear-gradient(#3a2410,#20140a);box-shadow:inset 0 0 0 2px #c9a24a,inset 0 0 10px rgba(0,0,0,.6);display:grid;place-items:center;cursor:pointer;touch-action:none}

", "a", "_", "H", "|", "o"] } }, LINKS6 = [["hearthspire", 0, 16, "r1", 0, 12, "step"], ["r1", 0, 12, "hearthspire", 0, 16, "step"], ["r1", 99, 9, "pebblebrook", 31, 12, "step"], ["pebblebrook", 31, 12, "r1", 99, 9, "step"], ["pebblebrook", 20, 1, "mine1", 2, 18, "step"], ["mine1", 2, 18, "pebblebrook", 20, 1, "step"], ["mine1", 29, 2, "mine2", 29, 2, "step"], ["mine2", 29, 2, "mine1", 29, 2, "step"], ["mine2", 4, 18, "mine3", 4, 1, "step"], ["mine3", 4, 1, "mine2", 4, 18, "step"], ["hearthspire", 8, 21, "room:bakery", 6, 7, "step"], ["hearthspire", 20, 6, "room:castle", 8, 7, "step"], ["hearthspire", 30, 21, "room:inn", 6, 7, "step"], ["hearthspire", 27, 5, "room:tower", 4, 5, "bump"], ["room:bakery", 11, 3, "room:cellar", 5, 6, "step"], ["room:cellar", 5, 6, "room:bakery", 11, 3, "step"], ["pebblebrook", 10, 9, "room:mill", 7, 6, "step"], ["pebblebrook", 26, 11, "room:pebinn", 6, 6, "step"], ["room:mill", 13, 3, "room:loft", 5, 5, "step"], ["room:loft", 5, 5, "room:mill", 13, 3, "step"], ["room:loft", 6, 5, "room:mill", 13, 3, "step"], ["room:bakery", 6, 7, "hearthspire", 8, 21, "step"], ["room:bakery", 7, 7, "hearthspire", 8, 21, "step"], ["room:castle", 8, 7, "hearthspire", 20, 6, "step"], ["room:castle", 9, 7, "hearthspire", 20, 6, "step"], ["room:inn", 6, 7, "hearthspire", 30, 21, "step"], ["room:inn", 7, 7, "hearthspire", 30, 21, "step"], ["room:tower", 4, 5, "hearthspire", 27, 5, "step"], ["room:tower", 5, 5, "hearthspire", 27, 5, "step"], ["room:mill", 7, 6, "pebblebrook", 10, 9, "step"], ["room:mill", 8, 6, "pebblebrook", 10, 9, "step"], ["room:pebinn", 6, 6, "pebblebrook", 26, 11, "step"], ["room:pebinn", 7, 6, "pebblebrook", 26, 11, "step"], ["hearthspire", 9, 0, "", 0, 0, "step", "never"], ["hearthspire", 39, 16, "", 0, 0, "step", "never"], ["hearthspire", 20, 29, "", 0, 0, "step", "never"], ["pebblebrook", 14, 23, "", 0, 0, "step", "never"], ["hearthspire", 11, 19, "", 0, 0, "step", "never"], ["room:cellar", 11, 4, "", 0, 0, "step", "never"]];

  // src/data/v6/story.js
  var SCRIPT6 = { "1.1": { id: "1.1", title: "Morning (the bakery) · new game · sets `act 1`", items: [{ dir: "Morning. The bakery smells of volcano fire. Mallow slides two buns across the counter.", show: !0 }, { who: "Mallow", text: "Two buns, {hero}. Same as every morning." }, { who: "{hero}", text: "Same as every morning. Good. I like things the same." }, { who: "Mallow", text: "So does my oven. It's older than me and twice as stubborn." }, { who: "Mallow", text: "Before you eat those: the cellar's got rats again. Take your stick." }, { who: "{hero}", text: "It's a very good stick." }, { who: "Mallow", text: "It's a stick, dear." }] }, "1.2": { id: "1.2", title: "The cellar (the bakery cellar) · `act 1` · set-piece fights 1 and 2: rats (Pip alone, no class yet: his stick)", items: [{ dir: "{hero} goes down the hatch. Three rats are in the flour sacks. Moving and attacking are taught here.", show: !1 }, { who: "{hero}", text: "Out. This flour is for buns, and the buns are for me." }, { dir: "A bigger rat noses out from behind the boarded door in the wall, with two friends. The hit chance on each foe is taught here.", show: !1 }, { who: "{hero}", text: "You're the boss rat, aren't you. You've got a boss face." }, { dir: "After the second fight {hero} looks at the old door, boarded over.", show: !0 }, { who: "Mallow", text: "(from the hatch) That's the flour tunnel. The carts used to come in under my bakery, before the roads." }, { who: "{hero}", text: "Why doesn't anyone use it?" }, { who: "Mallow", text: "It's full of rats." }, { who: "{hero}", text: "It WAS full of rats." }, { who: "Mallow", text: "Then it's a very good stick." }, { who: "Mallow", text: "Now, one more job. Light my lamp at the tower fire, would you?" }, { who: "Mallow", text: "Tomorrow is hatching day. The embers come out of my oven." }, { who: "Mallow", text: "And my oven wants a proper flame." }, { dir: "Sets `act 2`.", show: !1 }] }, "1.3": { id: "1.3", title: "The square (Bib's bench) · `act 2`", items: [{ who: "Bib", text: "{hero}! Morning. Sit down, the bench is warm." }, { who: "{hero}", text: "Can't. Errand. Lamp. Tower." }, { who: "Bib", text: "Hatching day tomorrow. Three eggs in the Nest. Everyone's talking about it." }, { who: "{hero}", text: "Are you going?" }, { who: "Bib", text: "Maybe. If I'm up. Here, have a bun. I had three." }, { who: "{hero}", text: "You're the best friend a kobold ever had." }, { who: "Bib", text: "I know. I once asked the whole town to fix the old mill with me. Nobody came." }, { who: "Bib", text: "It was fine. Everything's fine." }, { dir: "Bib's bench can be visited at any time in act 1; after this scene he says one of these (in turn):", show: !0 }, { who: "Bib", text: "Buns are fine, {hero}. Buns are always fine." }, { who: "Bib", text: "I'd help, but I'm sitting. You can't help AND sit. I've tried." }, { who: "Bib", text: "The fountain's nice today. It was nice yesterday too." }] }, "1.4": { id: "1.4", title: "The castle yard (the drill) · `act 2` · set-piece fights 3 and 4: the recruits, then the sergeant; the class is picked here", items: [{ dir: "The castle gate. Two guards, yawning.", show: !0 }, { who: "Guard", text: "Halt. Who goes there? (squints) Oh. It's the bun kid." }, { who: "Guard", text: "Go on, then. Mind the drill." }, { dir: "In the yard, a sergeant is shouting at recruits. Snatchclaw watches from the wall.", show: !0 }, { who: "Sergeant", text: "YOU. Small one. Pick up something and show me what you are." }, { dir: "The class picker opens: fighter, barbarian, paladin, ranger, rogue, monk, cleric, druid, bard, wizard, sorcerer, warlock", show: !1 }, { who: "Sergeant", text: "Not bad. For a kobold who eats that many buns. Now try ME." }, { dir: `The second bout: the sergeant and one recruit. It teaches the telegraphed big swing ("he's winding up, step away").`, show: !1 }, { who: "Sergeant", text: "(winding up) AND... SWING." }, { dir: "After the bout:", show: !1 }, { who: "Sergeant", text: "Hm. You moved. Most of them just stand there and take it." }, { who: "Snatchclaw", text: "(from the wall) Up early, bun boy? Good. Somebody should be." }, { who: "{hero}", text: "Who's that?" }, { who: "Guard", text: "The captain. Twenty winters on that wall. Never seen him sleep." }] }, "1.5": { id: "1.5", title: "The castle hall and the tower · `act 2`", items: [{ dir: "The hall, on the way to the tower stairs. A faded mural: kobolds carrying fire up a mountain, and at the front a kobold", show: !0 }, { who: "{hero}", text: "Doesn't look like it smiles. Looks like a pipe." }, { dir: "The tower fire at the top. {hero} holds out the lamp; the flame jumps into it.", show: !0 }, { who: "Tower guard", text: "Every hearth in Kobaldia was lit from that fire. Your baker's oven too." }, { who: "Tower guard", text: "Don't drop it." }, { who: "{hero}", text: "I never drop things. (He nearly drops it.)" }, { dir: "Back at the bakery, Mallow lights the oven from the lamp. Sets `act 3`. Night falls; {hero} sleeps.", show: !0 }] }, "1.6": { id: "1.6", title: "Hatching day (the bakery, then the square) · `act 3`", items: [{ dir: "Morning. Mallow lifts glowing embers out of the oven with tongs, one into each clay cup.", show: !0 }, { who: "Mallow", text: "Here, {hero}. Your ember. Keep it close, you chilly little lizard." }, { who: "{hero}", text: "It's warm." }, { who: "Mallow", text: "That's the idea. Take it to the Nest and warm whichever egg you think best." }, { who: "{hero}", text: "What if they're all bad?" }, { who: "Mallow", text: "Then pick the least bad, dear. That's most of life." }, { dir: "In the square only a handful of kobolds hold clay cups. Most are still in bed.", show: !0 }] }, "1.7": { id: "1.7", title: "The Great Nest (the castle yard) · `act 3`", items: [{ dir: "Three big eggs in the straw: a green one with little shoots, a grey one that seems to yawn, and a gold one on a pile of", show: !0 }, { who: "Bramble", text: "That's the sprouty one. More buns, and everybody helps at harvest." }, { who: "Bramble", text: "Work never hurt a kobold." }, { who: "Mallow", text: "I'm warming the sleepy one. My oven's old. A sleepy dragon keeps things as they are." }, { who: "Glint", text: "Look at it SHINE. It's got a RIBBON." }, { who: "Smudge", text: "The finest buns, friend! A sticker for everyone who warms the shiny one. Sticker?" }, { who: "{hero}", text: "No." }, { who: "Smudge", text: "Suit yourself. (to Glint) Sticker?" }, { who: "Glint", text: "(already holding out his ember) Yes please." }, { who: "Bramble", text: "Any of them will keep the raiders off the border." }, { who: "Bramble", text: "Dwarves, elves, humans. They all want our buns." }, { who: "Bramble", text: "The difference is who gets the buns afterwards." }, { dir: "The player can look at each egg (one line each):", show: !0 }, { who: "{hero}", text: "(sprouty) It's growing a leaf. Show-off." }, { who: "{hero}", text: "(sleepy) It's asleep. I respect that." }, { who: "{hero}", text: "(shiny) It's wearing a ribbon. Eggs shouldn't wear things." }, { dir: "Sets `act 4`.", show: !1 }] }, "1.8": { id: "1.8", title: "Why bother? (the Nest) · `act 4` · the refusal", items: [{ dir: "{hero} walks to the sprouty egg, cup in hand. Bib wanders up behind him.", show: !0 }, { who: "Bib", text: "{hero}. Why bother? A dragon's a dragon. You've got your buns." }, { who: "Bib", text: "Here. Have mine too." }, { who: "{hero}", text: "(looks at the bun, then the egg, then the bun) ...It's still warm." }, { dir: "{hero} pockets his ember, sits down in the warm straw and eats Bib's bun. He falls asleep.", show: !0 }, { dir: "Night. Almost nobody comes. Three guards walk in and hold their embers to the shiny egg.", show: !0 }, { who: "Guard", text: "Captain says the shiny one." }, { who: "Guard", text: "Captain says." }, { dir: "Glint is asleep next to the shiny egg, his sticker on his nose. The gold egg glows.", show: !0 }, { dir: "Dawn. CRACK.", show: !0 }, { who: "Glitterbeak", text: "...Cold. COLD. Why is everything so COLD?" }, { dir: "He sees Mallow's tray of morning buns, steaming. He eats the whole tray.", show: !0 }, { who: "Glitterbeak", text: "Warm. MINE." }, { dir: "He flies to the castle roof. {hero} wakes up with straw in his ear.", show: !0 }, { who: "{hero}", text: "What did I miss?" }, { dir: "Sets `act 5`. A notice goes up on the bakery: EVERY BATCH TO THE GUARDS FIRST.", show: !1 }] }, "1.9": { id: "1.9", title: "Somebody did (the bakery) · `act 5` · the mentor", items: [{ who: "{hero}", text: "Every batch to the guards? But I didn't choose any of this." }, { who: "Mallow", text: "No, dear. Somebody did." }, { dir: "Silence. Mallow kneads an empty bowl. Then she takes off her hat; there's a bun in it.", show: !0 }, { who: "Mallow", text: "One left. I hid it in my hat. Don't tell the dragon." }, { dir: "Mallow's bun (1 of 3) goes in the bag.", show: !0 }, { who: "Mallow", text: "(singing, quietly) When a dragon hatches cold, and he hoards the buns and gold..." }, { who: "{hero}", text: "I know that one. It's for babies." }, { who: "Mallow", text: "It's for everybody. (She takes down a fat recipe book.) My grandmother's." }, { who: "Mallow", text: "Recipes in the front. In the back, instructions for a thing called the Smiler." }, { who: "Mallow", text: "A piece in every town. Bring them together and you can fix a dragon that hatched wrong." }, { who: "{hero}", text: "So somebody should go and get them." }, { who: "Mallow", text: "Somebody should." }, { who: "{hero}", text: "...I'm going to Pebblebrook for flour. For buns. That's all." }, { who: "Mallow", text: "Of course you are, dear. Take the book." }, { dir: "Wizzle bursts in.", show: !0 }, { who: "Wizzle", text: "I'm COMING. I'm too young for an ember but I am NOT too young for this." }, { who: "Glint", text: "(in the doorway, sticker still on) I warmed the shiny one. For a sticker. ...I'll come too." }, { who: "{hero}", text: "Fine. Nobody talk to me before lunch." }, { dir: "Wizzle and Glint join. Sets `act 6`. The inn's first two campfire chats unlock (§6).", show: !1 }] }, "1.10": { id: "1.10", title: "Hearthspire's people in act 1 (one line each, by place)", items: [{ who: "Fountain kobold", text: "Hatching day! I'll go after my nap. (after the hatching:) Did I miss it? I missed it." }, { who: "Smith", text: "Sticks, swords, pans. A pan is a sword for buns." }, { who: "Moon shrine keeper", text: "Forget what you learned, little one? The moon remembers it for you. For a few coins." }, { who: "Shopkeeper", text: "Potions on the left, buns on the right. (after the hatching:) Potions on the left. Just potions now." }, { who: "Innkeeper", text: "A bed's ten gold, the fire's free, and the stories are worth what you pay for them." }, { who: "Barracks guard", text: "We're on the wall all night, every night. You lot sleep. That's fine. Somebody has to." }, { who: "Market board", text: '"Lost: one sock. Warm."' }, { who: "Market board", text: '"Raptor rides to Pebblebrook: SUSPENDED. No flour, no feed."' }] }, "1.11": { id: "1.11", title: "The capital gate · `act 6` · the threshold", items: [{ who: "Gate guard", text: "Going out? One bun. New rule." }, { who: "{hero}", text: "I haven't got a bun." }, { who: "Gate guard", text: "Then the next one you get is ours. (Flavour only: nothing leaves the bag, `design.md` §2.)" }, { who: "{hero}", text: "That was going to be my lunch." }, { who: "Gate guard", text: "It's the dragon's lunch now. He's a growing lad." }, { dir: "A kobold sits cross-legged by the gate, eyes shut.", show: !0 }, { who: "Bork", text: "Bork is meditating." }, { who: "Wizzle", text: "He's asleep." }, { who: "Bork", text: "(opens one eye) Bork napped through the hatching. Bork is... ashamed." }, { who: "Bork", text: "Bork would like to come. Bork will not nap." }, { who: "{hero}", text: "We're going for flour. Nothing more." }, { who: "Bork", text: "Bork likes flour. (nods off; Wizzle pokes him; he joins)" }, { dir: "Bork joins. Outside the gate, three Nettlenose scouts are pulling at a flour cart that isn't there any more.", show: !1 }] }, "1.12": { id: "1.12", title: "Outside the gate · `act 6`, after Bork joins · set-piece fight 5: Nettlenose scouts (the first fight with a pack of four; R1's newest foe)", items: [{ who: "Nettlenose scout", text: "Oi! Toll! Snatchclaw's orders! ...Have you got flour?" }, { who: "{hero}", text: "We're GOING for flour." }, { who: "Nettlenose scout", text: "Then we'll toll you on the way back!" }, { dir: "After the fight they scamper off down R1.", show: !0 }, { who: "Glint", text: "They had shiny buttons. Did anyone else see the buttons?" }, { dir: "Sets `act 7`: R1 is open.", show: !1 }] }, "2.0": { id: "2.0", title: "R1 (the capital gate → Pebblebrook)", items: [{ dir: "Signs and small scenes, in the order they're met.", show: !0 }, { who: "Sign", text: "PEBBLEBROOK 120 steps. Beetles." }, { who: "Sign by the pond", text: "NO SWIMMING (beetles)." }, { who: "Raptor stable sign", text: "RAPTOR STABLE. Shut. No flour, no feed, no raptors. Sorry. —The Riders" }, { who: "Grubb's sign", text: "TOLL: one bun. Or two. I'm flexible." }] }, "2.1": { id: "2.1", title: "The runaway goat (route extra) · any time", items: [{ who: "Goat", text: "Meh." }, { dir: "It follows the pack. It eats a sign. At the Mossback farms in Pebblebrook:", show: !1 }, { who: "Farmer Clover", text: "BUTTERCUP! You found her! She ate my gate again, didn't she." }, { who: "{hero}", text: "She ate a sign." }, { who: "Farmer Clover", text: "Progress. Here, take this ring, it's lucky. Buttercup never liked it." }] }, "2.2": { id: "2.2", title: "Tansy's lunch (the pond) · challenge step 2 · needs `pb ≥ 2`", items: [{ who: "Tansy", text: "I'm not going ANYWHERE hungry. I put my lunch down for one moment." }, { who: "Tansy", text: "One moment. And a beetle took it. Into the reeds." }, { dir: "A fight with a copper beetle and its friends in the tall grass by the pond.", show: !0 }, { who: "{hero}", text: "Your lunch. Slightly chewed." }, { dir: 'A choice appears: "Give it back" or "Eat it" (a deed, `corruption.md` #9: +2 corruption; "Give it back" is kind deed 3, −1). Eating it:', show: !0 }, { who: "Tansy", text: "You ATE it? ...Fine. I'm still coming. I'm not happy about it." }, { dir: 'Either way she comes; the line below is for "Give it back".', show: !1 }, { who: "Tansy", text: "(inspecting it) That's beetle chewing. Fine. I'll come to the circle." }, { who: "Tansy", text: "I'm eating it on the way, though." }] }, "3.1": { id: "3.1", title: "Arrival (the mill road, Grubb's toll) · `act 7` · sets `pb 1`", items: [{ dir: "A big kobold in a guard's helmet sits on a box across the mill road.", show: !0 }, { who: "Grubb", text: "HALT. Toll. One bun." }, { who: "{hero}", text: "The gate's already got my next one." }, { who: "Grubb", text: "Then you owe one. I'm writing it down. (He writes it down. It takes a while.)" }, { who: "Grubb", text: "Go on in. And stay off my mill road on the way out." }, { who: "Grubb", text: "Flour carts don't leave without paying." }, { who: "Sign", text: "PEBBLEBROOK. Home of the best flour in Kobaldia. (Flour currently unavailable.)" }, { dir: "The mill wheel stands still. Nobody is at the circle stones; on the biggest one, a chalk tally of marks.", show: !0 }] }, "3.2": { id: "3.2", title: "Ruddle (the mill) · `pb 1` · sets `pb 2` (the challenge opens)", items: [{ who: "Ruddle", text: "You're from the capital? Come for flour? Ha. Have a look at the wheel." }, { who: "{hero}", text: "It's not turning." }, { who: "Ruddle", text: "The dam's shut. The brook goes round my mill instead of through it." }, { who: "{hero}", text: "So open the dam." }, { who: "Ruddle", text: "Not alone, I can't. The dam is the whole town's. The shift circle decides it." }, { who: "Ruddle", text: "Everyone in the circle drops a stone in the bag. White, open it. Black, leave it." }, { who: "Ruddle", text: "Last spring the bag said leave it. By one stone." }, { who: "{hero}", text: "So do it again." }, { who: "Ruddle", text: "With what circle? The miners haven't sat in it in nine years." }, { who: "Ruddle", text: "I've been counting. On the stone." }, { who: "Ruddle", text: "Get the whole shift to the circle and we'll try again. Five of them." }, { who: "Ruddle", text: "Well. Four who might come. And one who never does." }, { who: "{hero}", text: "Why me?" }, { who: "Ruddle", text: `You're the only one in town who hasn't said "why bother" yet.` }, { who: "{hero}", text: "(who nearly did) ...Fine. Who are they?" }, { who: "Ruddle", text: "Ore, down the mine. Tansy, out by the pond." }, { who: "Ruddle", text: "Flint and Grit, who aren't speaking. And Old Marl." }, { dir: "The quest log lists the five miners as five lines (one per step) with a hint each, one tap away.", show: !1 }, { who: "Ruddle", text: "A smiler? Never heard of one. A flute, maybe. For a very big kobold.", when: "if asked about the Smiler" }, { who: "Ruddle", text: "Old things? The only old thing here is my axle. Stuck since my grandad's day." }] }, "3.3": { id: "3.3", title: "Grubb (the mill road) · `pb ≥ 2`, when the player walks onto the mill road · boss, L5", items: [{ who: "Grubb", text: "I SAID stay off my mill road." }, { who: "{hero}", text: "There's nothing to carry anyway. The mill's stopped." }, { who: "Grubb", text: "Then nothing pays nothing. That's still a toll." }, { dir: "Fight. Grubb swings big every third round, and shouts first.", show: !1 }, { who: "Grubb", text: "(winding up) HERE IT COMES." }, { dir: "After:", show: !1 }, { who: "Grubb", text: "Fine. FINE. Keep your road. (He takes his toll box and stomps off toward town, not the capital.)" }, { who: "Wizzle", text: "He went the wrong way. The capital's that way." }, { who: "{hero}", text: "Not my problem." }, { dir: "Sets `grubb 1`. The mill road is open; the raptor stable is still shut (no feed).", show: !1 }] }, "3.4": { id: "3.4", title: "Glitterbeak over the mill · after `grubb 1`, the next time the player comes to the mill", items: [{ dir: "A shadow slides over the mill. Glitterbeak lands on the roof and sniffs at the flour sacks in the loft window.", show: !0 }, { who: "Glitterbeak", text: "Mine. Mine. Mine. Mine. (He loses count.) ...Mine." }, { who: "Glitterbeak", text: "(shivering) Still cold." }, { dir: "He flies off. Where he sat, the roof is white with frost.", show: !0 }, { who: "Ruddle", text: "Third time this month. He doesn't even eat flour. He just likes to count it." }] }, "3.5": { id: "3.5", title: "Ore and Nugget (mine floor 1) · challenge step 1", items: [{ dir: "Near the stairs, a small kobold is arguing with a lantern seller who isn't there any more.", show: !0 }, { who: "Nugget", text: "Three copper for the lantern. For you, four." }, { who: "{hero}", text: "That's more." }, { who: "Nugget", text: "You look like you can afford it. Everything has a price." }, { who: "Nugget", text: "You're going deeper? You'll want a lantern. I have a lantern." }, { who: "Nugget", text: "I'll come WITH the lantern. Nine copper a day." }, { who: "{hero}", text: "No." }, { who: "Nugget", text: "Eight." }, { who: "Bork", text: "Bork has no copper." }, { who: "Nugget", text: "...Fine. Free. Just this once. Don't tell anybody." }, { who: "Nugget", text: "And if you see a nugget shaped like a duck, it's my grandad's. It's mine." }, { dir: "Nugget joins (he also brings a 5% discount at shops). At the end of the rails, a full cart is jammed.", show: !1 }, { who: "Ore", text: "Don't touch that cart. A full cart off the rails is a cart in the face." }, { who: "Ore", text: "I can't leave it, I can't move it, so I'm standing here. That's mining." }, { dir: "The rail puzzle: switch the points so the cart rolls back to the rail end.", show: !0 }, { who: "Ore", text: "Huh. Rolled right back. ...The circle? Nine years. Is Ruddle still counting?" }, { who: "{hero}", text: "On the stone." }, { who: "Ore", text: "Somebody has to sit on the big stone. Might as well be me." }] }, "3.6": { id: "3.6", title: 'The one stone (the mill loft) · challenge step 3, and the side quest "The one stone"', items: [{ dir: "Flint and Grit stand at opposite ends of the square, not looking at each other.", show: !0 }, { who: "Flint", text: "He dropped it. The stone. On the way to the bag. That's why it lost." }, { who: "Grit", text: "HE dropped it." }, { who: "Flint", text: "Did not." }, { who: "Grit", text: "Did." }, { who: "{hero}", text: "Where's the bag now?" }, { who: "Flint and Grit", text: "(pointing at the mill) Loft." }, { dir: "In the mill loft, the old bag hangs on a nail. There's a hole in the bottom. A white stone sits under it.", show: !0 }, { who: "{hero}", text: "Nobody dropped it. The bag did." }, { who: "Flint", text: "...Stupid bag." }, { who: "Grit", text: "Stupid bag." }, { who: "Flint", text: "We'll come. We're bringing our own bag." }, { who: "Grit", text: "I'm holding it." }, { who: "Flint", text: "I'M holding it." }, { dir: "The loft chest can be opened now (its key was in the bag).", show: !1 }] }, "3.7": { id: "3.7", title: "Old Marl (her house, then the mill) · challenge step 4", items: [{ who: "Old Marl", text: "The circle never listens. Nine years ago I stood up to speak and they'd already decided." }, { who: "Old Marl", text: "So I stopped going. Nobody noticed. That's how you know." }, { dir: "{hero} goes to the mill.", show: !0 }, { who: "{hero}", text: "Old Marl will come if she can speak first." }, { who: "Ruddle", text: "First? (a long pause) Yes. Of course. I should have said that nine years ago." }, { dir: "Back at Marl's house:", show: !1 }, { who: "Old Marl", text: "First? Hm. Then I'll come. And I'll be long." }] }, "3.8": { id: "3.8", title: "The fifth miner (the circle stones, at dusk) · after steps 1–4 · the twist", items: [{ dir: "Dusk. Someone sits alone in the empty circle, a toll box under his arm. It's Grubb, on the smallest stone.", show: !0 }, { who: "Grubb", text: "This was my stone. Before the helmet." }, { who: "{hero}", text: "You're from HERE?" }, { who: "Grubb", text: "Born by the dam. Nine years ago I said the dam was going to need fixing. Nobody listened." }, { who: "Grubb", text: "So I went where they do listen. The guards gave me a box and a road." }, { who: "Grubb", text: "Everybody listens to a toll." }, { who: "{hero}", text: "You're the one who never comes." }, { who: "Grubb", text: "Why would I? (He gets up and walks off into the dark.)" }, { who: "Ruddle", text: "(arriving with a lantern) So you've met our fifth." }, { who: "Ruddle", text: "Snipe's down the mine taking half the copper. Deal with him first." }, { who: "Ruddle", text: "Then we'll see about Grubb." }, { dir: "Sets `pb 3`.", show: !1 }] }, "3.9": { id: "3.9", title: "Snipe (mine floor 3) · `pb 3` · boss, L8", items: [{ dir: "A guard on a copper cart, behind a pile of copper.", show: !0 }, { who: "Snipe", text: "Half the copper for the guards. Half the half for me." }, { who: "Snipe", text: "The rest for the miners. That's sums." }, { who: "{hero}", text: "That's not sums." }, { who: "Snipe", text: "It's MY sums." }, { dir: "Fight. Snipe rolls behind cover on his cart.", show: !1 }, { dir: "After:", show: !1 }, { who: "Snipe", text: "Fine! Take it! Copper's heavy anyway." }, { who: "Nugget", text: "(already filling his pockets) Is it, though?" }, { who: "{hero}", text: "Put it back. It's the miners'." }, { who: "Nugget", text: "...I was counting it. For them." }, { dir: "Sets `pb 4`. The flooded gallery (the hidden trial, Old Shellback) is next to Snipe's pile; it has no lines.", show: !1 }] }, "3.10": { id: "3.10", title: "Grubb's stone (the toll box) · `pb 4` · challenge step 5", items: [{ dir: "Grubb sits on his toll box on the mill road. {hero}, Nugget and Old Marl walk up together.", show: !0 }, { who: "Old Marl", text: "Grubb. I'm speaking first today. I'd like you to hear it." }, { who: "Grubb", text: "You lot never let anybody speak first." }, { who: "Old Marl", text: "We do now. Ruddle said." }, { who: "Nugget", text: "And the toll box is worth nothing. I checked. It's empty." }, { who: "Grubb", text: "(looks in the box; it's empty) ...It's always been empty. Nobody paid." }, { who: "Grubb", text: "(puts the helmet in the box) My stone's still there?" }, { who: "{hero}", text: "Smallest one." }, { who: "Grubb", text: "It was always the smallest one." }, { dir: "Sets `pb 5`.", show: !1 }] }, "3.11": { id: "3.11", title: "The circle meets (the circle stones) · `pb 5` · the reconciliation", items: [{ dir: "The whole shift sits on the stones: Ore on the big one, Tansy eating, Flint and Grit holding one bag together, Grubb", show: !0 }, { who: "Old Marl", text: "I've waited nine years to say this. The dam leaks on the east side." }, { who: "Old Marl", text: "That's all. That's what I wanted to say. Sit down, Marl." }, { who: "Ruddle", text: "Stones in the bag. White, open it. Black, leave it." }, { dir: "One by one they drop stones in. Ruddle tips the bag out on the big stone. All white.", show: !0 }, { who: "Ruddle", text: "Open. Every stone. Even Grubb's." }, { who: "Grubb", text: "(quietly) Even mine." }, { dir: "Ruddle wipes the chalk tally off the stone with his sleeve.", show: !0 }] }, "3.12": { id: "3.12", title: "The wheel turns, the tube (the mill) · after the circle · sets `pb 6`", items: [{ dir: "The dam opens, the brook runs through the mill and the wheel groans. Something clanks inside.", show: !0 }, { who: "Ruddle", text: "That's the old axle. It's come loose. (He pulls out a long iron tube with a smile cut into one end.)" }, { who: "{hero}", text: `(opening Mallow's book) "The tube." That's a piece. That's a Smiler piece.` }, { who: "Ruddle", text: "Take it. It never turned right anyway." }, { who: "Nugget", text: "That's worth at least—" }, { who: "{hero}", text: "No." }, { dir: "The first Smiler piece. The raptor stable opens on the mill road.", show: !0 }, { who: "Rider", text: "Flour-feed's back! Raptors are flying! Well. Running. They don't fly. Hop on." }, { dir: "Raptor travel is unlocked.", show: !1 }] }, "3.13": { id: "3.13", title: "Pebblebrook's people (one or two lines each)", items: [{ who: "Innkeeper", text: "Beds upstairs, the fire's down here. We don't have flour, so the pies are just crust." }, { who: "Innkeeper", text: "Pies are back. Real ones. With insides.", when: "after the mill turns" }, { who: "Shopkeeper", text: "Picks, lamps, and swords that were picks once." }, { who: "Smith", text: "Bring me five scraps of gold and I'll make you miller's boots." }, { who: "Smith", text: "Very good for standing still in." }, { who: "Ruddle's apprentice", text: "I chalk a new mark every morning. Nine years. Nearly ran out of stone." }, { who: "Farmer at the fountain", text: "The guards say the toll keeps the raiders off." }, { who: "Farmer at the fountain", text: "Can't see how. Raiders don't use the mill road." }, { who: "Note board", text: '"Ghost in the mill!!"' }, { who: "Note board", text: '"Anyone seen Buttercup? (goat)"' }, { who: "Note board", text: '"BOUNTY: Big Pinch" · "BOUNTY: Nettlenose scout leader"' }] }, "3.14": { id: "3.14", title: "Side quests and bounties", items: [{ dir: "The ghost of the mill (funny). A kobold by the mill, shaking.", show: !0 }, { who: "Shaky kobold", text: "There's a GHOST in the mill. All white. It goes skree." }, { dir: "In the mill: a raptor chick, covered head to toe in flour.", show: !0 }, { who: "Raptor chick", text: "Skree." }, { who: "{hero}", text: "It's a chick. In flour." }, { who: "Rider", text: "(later) We'll keep her. She's already named. She's called Ghost." }, { dir: "Seed swap (the land). A Mossback farmer at the farms.", show: !0 }, { who: "Farmer Clover", text: "Moss tufts! Bring me three and I'll give you seeds." }, { who: "Farmer Clover", text: "Moss for seeds, seeds for moss. That's farming." }, { dir: "After:", show: !1 }, { who: "Farmer Clover", text: "Here, a cape. It's moss. It's warm. You'd be amazed what moss can do." }, { who: "Board", text: "BIG PINCH. A copper beetle the size of a cart. Eats boots. Reward 40 gold." }, { who: "Board", text: "A Nettlenose with a sergeant's hat. Says he's the guard" }, { who: "Nettlenose scout leader", text: "I'm the sergeant's cousin! I have a hat!" }] }, "6.0": { id: "6.0", title: "The slice's campfire chats", items: [{ dir: "Chats play at an inn when everyone in them is in the pack (`companions.md`). Each gives +1 bond to every companion in it.", show: !0 }] }, "6.1": { id: "6.1", title: "You HAD one?! (Wizzle) · Hearthspire inn, after §1.9", items: [{ who: "Wizzle", text: "{hero}. You had an ember. A real one. From Mallow." }, { who: "{hero}", text: "Still have it." }, { who: "Wizzle", text: "You HAD one and you KEPT it?!" }, { who: "{hero}", text: "I was going to use it. I got a bun." }, { who: "Wizzle", text: "I'd have given ANYTHING for an ember. I'd have given you my tail." }, { who: "{hero}", text: "I don't want your tail." }, { who: "Wizzle", text: "Nobody ever wants my tail. Grandma says I'm too young to count." }, { who: "{hero}", text: "You're counting now. You're coming, aren't you?" }, { who: "Wizzle", text: "(quiet for once) ...Yeah." }] }, "6.2": { id: "6.2", title: "The sticker (Glint) · Hearthspire inn, after §1.9", items: [{ who: "Glint", text: "Want to see my sticker?" }, { who: "{hero}", text: "No." }, { who: "Glint", text: "It's a dragon. With a ribbon. It shines when you tilt it." }, { who: "{hero}", text: "That's the dragon who ate Mallow's tray." }, { who: "Glint", text: "(tilting it) He looks so friendly on the sticker." }, { who: "{hero}", text: "He's on the castle roof stealing buns." }, { who: "Glint", text: "...I didn't know it was that kind of shiny." }, { who: "Glint", text: "I'll keep it anyway. I keep everything shiny. It's the only thing I'm good at." }] }, "6.3": { id: "6.3", title: "Bork is meditating (Bork) · Pebblebrook inn", items: [{ who: "Bork", text: "Bork is meditating." }, { who: "{hero}", text: "You're snoring." }, { who: "Bork", text: "Bork meditates loudly." }, { who: "Bork", text: "(awake) On hatching night Bork lay down for one minute. To rest his eyes." }, { who: "Bork", text: "When Bork opened them there was a dragon. And no buns." }, { who: "Wizzle", text: "You slept through the WHOLE THING?" }, { who: "Bork", text: "Bork slept through the whole thing." }, { who: "Bork", text: "Bork will not nap through anything again. (He yawns.) Starting tomorrow." }] }, "6.4": { id: "6.4", title: "Everything has a price (Nugget) · Pebblebrook inn, after §3.5", items: [{ who: "Nugget", text: "How much do you want for the stick?" }, { who: "{hero}", text: "It's not for sale." }, { who: "Nugget", text: "Everything has a price. Even you." }, { who: "{hero}", text: "What's my price?" }, { who: "Nugget", text: "(looks him up and down) Two buns. Every morning. You'd be cheap." }, { who: "{hero}", text: "(says nothing for a while)" }, { who: "Nugget", text: "It was a joke. Mostly. I'd pay three." }] }, "6.5": { id: "6.5", title: "Who deserves an ember (Wizzle and Nugget) · Pebblebrook inn, after §3.9", items: [{ who: "Wizzle", text: "The miners all have embers. Every one. Even the brothers who don't talk." }, { who: "Nugget", text: "Everybody grown has one. You get one from the tower fire. That's how it works." }, { who: "Wizzle", text: "Well I think you should have to DESERVE it." }, { who: "Nugget", text: "Who decides who deserves it?" }, { who: "Wizzle", text: "...Somebody clever." }, { who: "Nugget", text: "Like who?" }, { who: "Wizzle", text: "(thinks hard) Me." }, { who: "Nugget", text: "I'd sell mine to you. Price on request." }, { who: "Wizzle", text: "You can't SELL an ember!" }, { who: "Nugget", text: "Then what's it for?" }, { dir: "Neither of them knows. They both look at {hero}'s pocket. {hero} pretends to be asleep.", show: !0 }] } }, SCENES6 = [{ id: "1.1", at: { start: 1 }, steps: [["say", null, null, 0, 6], ["set", { act: 1 }]] }, { id: "1.2", at: { place: "room:cellar", enter: 1 }, when: { act: 1 }, steps: [["say", null, "Out. This flour", 0, 1], ["fight", "rats1"], ["say", "A bigger rat", "You're the boss rat", 2, 3], ["fight", "rats2"], ["chest", "Mallow's old box"], ["say", "After the second fight", null, 4, 13], ["give", "lamp", 1], ["set", { act: 2, lamp: 1 }]] }, { id: "1.3", at: { place: "hearthspire", npc: "bib" }, when: { act: 2 }, steps: [["say", null, "Everything's fine.", 0, 7], ["set", { bib1: 1 }]] }, { id: "1.4", at: { place: "hearthspire", area: [19.5, 11, 1] }, when: { act: 2, drill: 0 }, steps: [["say", null, "show me what you are", 0, 4], ["class"], ["fight", "drill1"], ["say", "Not bad.", "Now try ME", 6, 6], ["fight", "drill2"], ["say", "Hm. You moved", null, 10, 13], ["set", { drill: 1 }]] }, { id: "1.5a", from: "1.5", at: { place: "room:castle", enter: 1 }, when: { act: { gte: 2 }, mural: 0 }, steps: [["say", null, "Looks like a pipe", 0, 1], ["set", { mural: 1 }]] }, { id: "1.5b", from: "1.5", at: { place: "room:tower", enter: 1 }, when: { act: 2, lamp: 1 }, steps: [["say", "The tower fire at the top", "I never drop things", 2, 5], ["set", { lamp: 2 }]] }, { id: "1.5c", from: "1.5", at: { place: "room:bakery", npc: "mallow" }, when: { act: 2, lamp: 2 }, steps: [["say", "Back at the bakery", null, 6, 6], ["set", { act: 3 }]] }, { id: "1.6", at: { place: "room:bakery", npc: "mallow" }, when: { act: 3, ember: 0 }, steps: [["say", null, null, 0, 6], ["give", "ember", 1], ["set", { ember: 1 }]] }, { id: "1.7", at: { place: "hearthspire", area: [19.5, 8.5, 2.2] }, when: { act: 3, ember: 1 }, steps: [["say", null, "The difference is who gets the buns", 0, 11], ["set", { act: 4 }]] }, { id: "1.8", at: { place: "hearthspire", bump: [19.5, 8.5, 3] }, when: { act: 4 }, steps: [["say", null, null, 0, 15], ["set", { act: 5 }]] }, { id: "1.9", at: { place: "room:bakery", npc: "mallow" }, when: { act: 5 }, steps: [["say", null, "Don't tell the dragon.", 0, 3], ["give", "bun", 1], ["say", "si         return '<button class="rpb' + (g ? "" : " x") + '" type="button" data-rp="v6uneq" data-v="' + k2 + '"' + (g && k2 !== "weapon" ? "" : " disabled") + ">" + esc2(nm(g, k2)) + "<small>" + k2.replace(/\d/, "") + (g && g.tier != null ? " · T" + (g.tier + 1) : "") + (g && g.set ? " · " + esc2(g.set) : "") + (g && k2 !== "weapon" ? " · tap to take off" : "") + "</small></button>";
      }).join("") + "</div>";
      let W = (rp.s.inv6 || []).filter((it) => v6CanWear(m, it));
      W.length && (h += '<div class="rpcmd">' + W.map((it) => '<button class="rpb go" type="button" data-rp="v6eqit" data-v="' + it.id + '">' + esc2(v6ItemName(it)) + "<small>wear it · T" + (it.tier + 1) + " " + it.slot + "</small></button>").join("") + "</div>");
      let bag = Object.entries(rp.s.bag || {}).filter(([k2, v2]) => v2 > 0).map(([k2, v2]) => k2 + " ×" + v2).concat(Object.entries(rp.s.mats6 || {}).filter(([k2, v2]) => v2 > 0).map(([k2, v2]) => k2 + " ×" + v2));
      bag.length && (h += "<p><small>Bag: " + esc2(bag.join(" · ")) + "</small></p>");
    }
    if (m.hero) {
      let L = Object.assign({ might: 0, wits: 0, lead: 0 }, m.lead), free = v6LeadFree(m);
      h += '<div class="who">Leader points (' + free + " of " + v6LeadTotal(m) + ' free)</div><div class="rpcmd">' + [["might", "Might", "pack attack and defence +1% each"], ["wits", "Wits", "pack special attack and defence +1% each"], ["lead", "Leadership", "pack morale +1 per 5"]].map(([key2, n, d]) => '<button class="rpb' + (free ? " go" : "") + '" type="button" data-rp="v6lead" data-v="' + key2 + '"' + (free ? "" : " disabled") + ">" + n + " " + L[key2] + "<small>" + d + "</small></button>").join("") + "</div>";
    }
    return sheet.msg && (h += '<p class="tmsg">' + esc2(sheet.msg) + "</p>"), h + '</div><div class="tbar">' + (rp.s && rp.s.w6 ? "" : '<button class="rpb" type="button" data-rp="v6lvl">Level up<small>test</small></button>') + '<button class="rpb x" type="button" data-rp="v6sheetx">Back</button></div>';
  }
  feature({
    id: "v6sheet",
    menu: [{ order: 5, html: () => rp.s && rp.s.w6 ? '<button class="rpb go" type="button" data-rp="v6sheet" data-v="0">The pack<small>sheets, talents' + (rp.s.party.some((m) => m.pend > 0) ? " · ✦ a pick waiting" : "") + "</small></button>" : "" }],
    panels: { v6sheet: { sig: () => JSON.stringify([sheet, rp.s && (rp.s.inv6 || []).length, rp.s && rp.s.party.map((m) => JSON.stringify(m.gear)).join(""), pack().map((m) => m && [m.lvl, m.pend, m.scores, m.skills, m.known, m.ranks, m.passives, m.dark, m.lead, m.sub, m.hp, m.corr])]), html: v6SheetHtml } },
    actions: {
      v6sheet: (d) => {
        d.v != null && (sheet.i = +d.v), sheet.pick = null, sheet.msg = "", rp.mode = "v6sheet";
      },
      v6sheetx: () => {
        rp.mode = rp.s && rp.s.w6 ? "map" : "lab";
      },
      v6pick: (d) => {
        sheet.pick = [d.k, d.v];
      },
      v6pickok: () => {
        let m = cur();
        m && sheet.pick && (sheet.msg = v6Pick(m, sheet.pick[0], sheet.pick[1]) ? "Taken." : "That card is gone.", sheet.pick = null);
      },
      v6sub: (d) => {
        let m = cur();
        m && (sheet.msg = v6ChooseSub(m, d.v) ? m.name + " is a " + d.v + " now." : "");
      },
      v6eq: (d) => {
        let m = cur();
        m && !v6Equip(m, d.v) && (sheet.msg = "Four skills at most; unequip one first.");
      },
      v6dark: (d) => {
        let m = cur();
        m && v6ToggleDark(m, d.v);
      },
      v6lead: (d) => {
        let m = cur();
        m && v6LeadAdd(m, d.v);
      },
      v6uneq: (d) => {
        let m = cur();
        m && v6Unequip(m, d.v);
      },
      v6eqit: (d) => {
        let m = cur();
        m && !v6Equip6(m, d.v) && (sheet.msg = "That does not fit.");
      },
      v6lvl: () => {
        let m = cur();
        m && m.lvl < 30 && (v6LevelUp(m), sheet.msg = m.name + " reached level " + m.lvl + ".");
      }
    }
  });

  // src/main.js
  boot();
})();

</script>

</html>
